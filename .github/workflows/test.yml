name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install development dependencies
        run: python -m pip install --group dev
      - name: Check formatting with Ruff
        run: python -m ruff format --check codex_read_only_approver.py test_codex_read_only_approver.py
      - name: Lint with Ruff
        run: python -m ruff check codex_read_only_approver.py test_codex_read_only_approver.py
      - name: Type-check with mypy
        run: python -m mypy codex_read_only_approver.py test_codex_read_only_approver.py
      - name: Type-check with Pyright
        run: python -m pyright codex_read_only_approver.py test_codex_read_only_approver.py
      - name: Run unit tests
        run: python -m unittest -v
      - name: Compile Python sources
        run: python -m py_compile codex_read_only_approver.py test_codex_read_only_approver.py
