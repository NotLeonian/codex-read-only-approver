version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: disabled
    allow:
      # Allow updates for all direct and indirect dependencies.
      - dependency-type: "all"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      actions:
        applies-to: version-updates
        # Group official GitHub Actions updates into a single pull request.
        patterns:
          - "actions/*"
