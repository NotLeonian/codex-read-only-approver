[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-read-only-approver"
version = "0.2.1"
description = "Conservative Codex PermissionRequest hook for statically read-only Bash commands"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["codex", "hook", "permissions", "security", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]

[project.scripts]
codex-read-only-approver = "codex_read_only_approver:main"

[tool.mypy]
python_version = "3.10"

[tool.pyright]
pythonVersion = "3.10"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["I"]

[tool.setuptools]
py-modules = ["codex_read_only_approver"]

[tool.setuptools.data-files]
"share/codex-read-only-approver" = [
  "README.md",
  "README.ja.md",
  "AGENTS.md.snippet",
  "SECURITY.md",
  "config.json.example",
  "hooks.json.example",
  "codex-read-only-approver.rules.example",
  "SKILL.md.example",
]
